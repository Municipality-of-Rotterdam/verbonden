developmentStatus: development

description:
  nl:
    shortDescription: >-
      POC voor het digitaliseren van huwelijksaanvragen bij de Gemeente
      Rotterdam.

    longDescription: |
      Dit project is een proof-of-concept applicatie voor het digitaliseren
      van het huwelijksaangifteproces bij de Gemeente Rotterdam. Burgers
      kunnen hun huwelijk of geregistreerd partnerschap digitaal aanvragen en
      plannen. Daarnaast bevat de applicatie een beheeromgeving voor het
      beheren van Buitengewoon Ambtenaren van de Burgerlijke Stand (BABS).

      Dit is een proof-of-concept: de functionaliteit is nog incompleet en
      wordt actief doorontwikkeld.

    features:
      - Digitale huwelijksaangifte voor burgers
      - Beheer van Buitengewoon Ambtenaren van de Burgerlijke Stand (BABS)

