<!DOCTYPE html>
<html xmlns:wicket="http://wicket.apache.org">
<head>
    <meta charset="UTF-8"/>
    <title>Dossiers Beheer</title>
</head>
<body>
<wicket:extend>
    <h1>Dossiers</h1>

    <form wicket:id="zoekForm" class="d-flex gap-2 mb-3">
        <input wicket:id="zoektermVeld" type="search" class="utrecht-textbox" placeholder="Zoek op dossier-ID of BSN"/>
        <button wicket:id="zoekButton" type="submit" class="utrecht-button utrecht-button--primary-action">Zoeken</button>
    </form>

    <table wicket:id="dossierTable"></table>
</wicket:extend>
</body>
</html>
