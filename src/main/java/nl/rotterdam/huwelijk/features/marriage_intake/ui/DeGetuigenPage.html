<wicket:extend>

    <!-- Page heading -->
    <h1 wicket:id="heading">Benoem jullie getuigen</h1>

    <!-- Intro text -->
    <p class="rd-intro-text" wicket:id="intro">
        Geef hieronder de namen van jullie getuigen door. Na betaling en bevestiging vragen wij om
        de gegevens te verifi&#235;ren door een identiteitscontrole.
    </p>

    <div wicket:id="getuigen">
        <form wicket:id="getuigeForm" class="rd-getuige-form">
            <wicket:border wicket:id="getuigeFieldset">
                <!-- RdFormFieldTextInput renders label + input + validation -->
                <div wicket:id="naam"></div>
                <div wicket:id="bestandInput">
                    <input wicket:id="input" type="file"/>
                </div>
                <span wicket:id="bestandNaamLabel" class="rd-getuige-block__bestand-naam"></span>
            </wicket:border>
        </form>
    </div>

</wicket:extend>
