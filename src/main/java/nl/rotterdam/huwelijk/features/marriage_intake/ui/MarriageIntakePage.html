<wicket:extend>

    <!-- Page heading (rendered by RdHeading) -->
    <h1 wicket:id="heading">Heading</h1>
    <p class="rd-intro-text">
        <wicket:message key="intake.intro.marriageintake">Intro tekst</wicket:message>
    </p>

    <!-- Alert: BSN belongs to a different dossier; automatically switched -->
    <div wicket:id="wrongDossierAlert"></div>

    <!-- Alert: requested dossier is full and this BSN has no access -->
    <div wicket:id="notAuthorizedAlert"></div>

    <!-- Form -->
    <form wicket:id="form">

        <!-- Registratie section (RdRadioGroup border) -->
        <div class="rd-card" wicket:id="registrationGroup">
            <div class="d-flex gap-3 flex-wrap">
                <label class="flex-fill rd-radio-option" for="huwelijk-input">
                    <input type="radio" wicket:id="huwelijk" id="huwelijk-input"/>
                    <wicket:message key="intake.registratie.huwelijk">Huwelijk</wicket:message>
                </label>
                <label class="flex-fill rd-radio-option" for="partnerschap-input">
                    <input type="radio" wicket:id="geregistreerdPartnerschap" id="partnerschap-input"/>
                    <wicket:message key="intake.registratie.partnerschap">Geregistreerd partnerschap</wicket:message>
                </label>
            </div>
        </div>

            <!-- Partner akkoord section -->
            <!-- DigiD button is intentionally non-functional at this stage of the POC -->
        <div class="rd-partner-akkoord">
            <h2 class="rd-partner-akkoord__heading">
                <wicket:message key="intake.partnerakkoord.heading">Partner akkoord</wicket:message>
            </h2>
            <p class="rd-partner-akkoord__tekst">
                <wicket:message key="intake.partnerakkoord.description">Beschrijving partner akkoord</wicket:message>
            </p>
            <div class="rd-partner-akkoord__buttons">
                <span class="rd-digid-logo">Digi<span>D</span></span>
                <button type="button" class="rd-digid-button">
                    <wicket:message key="intake.partnerakkoord.digid.button">Inloggen met DigiD</wicket:message>
                </button>
            </div>
        </div>

        <!-- Ceremony section heading (outside cards) -->
        <h2 class="rd-ceremony-heading">
            <wicket:message key="intake.soort.heading">Wat voor ceremonie willen jullie?</wicket:message>
        </h2>
        <p class="rd-intro-text">
            <wicket:message key="intake.soort.description">Al uw keuzes hebben invloed op elkaar.</wicket:message>
        </p>

        <!-- Three ceremony columns (dynamic, from database) -->
        <div class="row g-3">

            <wicket:container wicket:id="ceremonyTypesList">
                <div class="col-12 col-md-4 d-flex">
                    <div class="rd-soort-optie w-100">
                        <h3 class="rd-soort-option__title" wicket:id="titel">Titel</h3>

                        <!-- Price: optional "Vanaf" prefix + status badge -->
                        <div class="d-flex align-items-center gap-2">
                            <span wicket:id="prijsPrefix" class="rd-price-badge-prefix">Vanaf</span>
                            <span wicket:id="prijs" class="utrecht-status-badge rd-price-badge"></span>
                        </div>

                        <!-- Bullet points (flex:1 in CSS pushes date + button to bottom) -->
                        <ul class="rd-soort-optie__bullets" wicket:id="bullets">
                            <li wicket:id="bullet">Beschrijving</li>
                        </ul>

                        <!-- Eerste mogelijkheid (text for now; dates come from the service) -->
                        <div class="rd-eerste-mogelijkheid" wicket:id="eersteGelegenheidBox">
                            <span class="rd-eerste-mogelijkheid__label">
                                <wicket:message key="intake.soort.eerste.mogelijkheid">Eerste mogelijkheid</wicket:message>
                            </span>
                            <span class="rd-eerste-mogelijkheid__datum" wicket:id="eersteGelegenheid">-</span>
                        </div>

                        <button type="submit" wicket:id="kiesButton"></button>
                    </div>
                </div>
            </wicket:container>

        </div>

    </form>

    <!-- Verder naar Mijn dag — only rendered when a dossier already exists -->
    <div wicket:id="verderContainer" class="rd-verder-nav">
        <a wicket:id="verderLink" class="rd-button">
            <wicket:message key="intake.verder">Verder naar Mijn dag</wicket:message>
        </a>
    </div>

</wicket:extend>
