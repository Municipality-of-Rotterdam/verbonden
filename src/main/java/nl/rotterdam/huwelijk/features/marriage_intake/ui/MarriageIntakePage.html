<wicket:extend>

    <!-- Page heading (rendered by RdHeading) -->
    <h1 wicket:id="heading">Heading</h1>
    <p class="rd-intro-text">
        <wicket:message key="intake.intro.marriageintake">Kies eerst wat voor soort dag jullie willen en ga daarna jullie dag plannen.</wicket:message>
    </p>

    <!-- Form -->
    <form wicket:id="form">

        <!-- Registratie section (RdRadioGroup border) -->
        <div class="rd-card" wicket:id="registrationGroup">
            <div class="d-flex gap-3 flex-wrap">
                <label class="flex-fill rd-radio-option" for="huwelijk-input">
                    <input type="radio" wicket:id="huwelijk" id="huwelijk-input"/>
                    <wicket:message key="intake.registratie.huwelijk">Huwelijk</wicket:message>
                </label>
                <label class="flex-fill rd-radio-option" for="partnerschap-input">
                    <input type="radio" wicket:id="geregistreerdPartnerschap" id="partnerschap-input"/>
                    <wicket:message key="intake.registratie.partnerschap">Geregistreerd partnerschap</wicket:message>
                </label>
            </div>
        </div>

        <!-- Soort section (RdRadioGroup border) -->
        <div class="rd-card" wicket:id="ceremonyGroup">
            <div class="row g-3">
                <!-- Gratis -->
                <div class="col-12 col-md-4 d-flex flex-column gap-2 rd-soort-option">
                    <div class="d-flex justify-content-between align-items-center mb-1">
                        <span class="rd-soort-option__title"><wicket:message key="intake.soort.gratis.title">Gratis</wicket:message></span>
                        <span class="rd-price-badge">&#x20AC;&nbsp;<wicket:message key="intake.soort.gratis.prijs">00,00</wicket:message></span>
                    </div>
                    <p class="rd-soort-option__desc">
                        <wicket:message key="intake.soort.beschrijving">At vero eos et accusamus</wicket:message>
                        <a href="https://www.rotterdam.nl/">rotterdam.nl/</a>
                    </p>
                    <label class="rd-soort-radio-box mt-auto" for="gratis-input">
                        <input type="radio" wicket:id="gratis" id="gratis-input"/>
                        <wicket:message key="intake.soort.gratis.title">Gratis</wicket:message>
                    </label>
                </div>

                <!-- Eenvoudig -->
                <div class="col-12 col-md-4 d-flex flex-column gap-2 rd-soort-option">
                    <div class="d-flex justify-content-between align-items-center mb-1">
                        <span class="rd-soort-option__title"><wicket:message key="intake.soort.eenvoudig.title">Eenvoudig</wicket:message></span>
                        <span class="rd-price-badge">&#x20AC;&nbsp;<wicket:message key="intake.soort.eenvoudig.prijs">267,81</wicket:message></span>
                    </div>
                    <p class="rd-soort-option__desc">
                        <wicket:message key="intake.soort.beschrijving">At vero eos et accusamus</wicket:message>
                        <a href="https://www.rotterdam.nl/">rotterdam.nl/</a>
                    </p>
                    <label class="rd-soort-radio-box mt-auto" for="eenvoudig-input">
                        <input type="radio" wicket:id="eenvoudig" id="eenvoudig-input"/>
                        <wicket:message key="intake.soort.eenvoudig.title">Eenvoudig</wicket:message>
                    </label>
                </div>

                <!-- Regulier -->
                <div class="col-12 col-md-4 d-flex flex-column gap-2 rd-soort-option">
                    <div class="d-flex justify-content-between align-items-center mb-1">
                        <span class="rd-soort-option__title"><wicket:message key="intake.soort.regulier.title">Regulier</wicket:message></span>
                        <span class="rd-price-badge">&#x20AC;&nbsp;<wicket:message key="intake.soort.regulier.prijs">461,48</wicket:message></span>
                    </div>
                    <p class="rd-soort-option__desc">
                        <wicket:message key="intake.soort.beschrijving">At vero eos et accusamus</wicket:message>
                        <a href="https://www.rotterdam.nl/">rotterdam.nl/</a>
                    </p>
                    <label class="rd-soort-radio-box mt-auto" for="regulier-input">
                        <input type="radio" wicket:id="regulier" id="regulier-input"/>
                        <wicket:message key="intake.soort.regulier.title">Regulier</wicket:message>
                    </label>
                </div>
            </div>
        </div>

        <!-- Submit button -->
        <div class="d-flex justify-content-end mt-4">
            <button wicket:id="submitButton" type="submit">
                <span wicket:id="icon">ring icon</span>
                <wicket:message key="intake.button.plan">Plan jullie dag</wicket:message>
            </button>
        </div>

    </form>

</wicket:extend>
