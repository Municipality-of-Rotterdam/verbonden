<!DOCTYPE html>
<html xmlns:wicket="http://wicket.apache.org">
<head>
    <meta charset="UTF-8"/>
    <title>Huwelijkstypen beheer</title>
</head>
<body>
<wicket:extend>

    <h1>Huwelijkstypen beheer</h1>

    <p>
        <a wicket:id="nieuwHuwelijkstypeLink" class="utrecht-button utrecht-button--primary-action">Nieuw huwelijkstype toevoegen</a>
    </p>

    <form wicket:id="actionsForm">
        <table wicket:id="huwelijkstypeTable"></table>
    </form>

    <wicket:fragment wicket:id="actiesFragment">
        <button wicket:id="bewerkLink"><span wicket:id="icon"></span></button>
        <button wicket:id="verwijderLink"><span wicket:id="icon"></span></button>
    </wicket:fragment>

</wicket:extend>
</body>
</html>
