<!DOCTYPE html>
<html xmlns:wicket="http://wicket.apache.org">
<head>
    <meta charset="UTF-8"/>
    <title>BAPS wijzigen</title>
</head>
<body>
<wicket:extend>
    <h1>BAPS wijzigen</h1>

    <p><a wicket:id="terugLink" class="utrecht-button utrecht-button--secondary-action">Terug naar overzicht</a></p>

    <div wicket:id="feedback"></div>

    <form wicket:id="bapsForm" class="d-flex flex-column gap-3">
        <div wicket:id="naam"></div>
        <div wicket:id="fotoUrl"></div>
        <div wicket:id="detailUrl"></div>
        <div wicket:id="beschikbareDagen">
            <div class="d-flex flex-column gap-2">
                <label wicket:id="day">
                    <input type="checkbox" wicket:id="checkbox"/>
                    <wicket:container wicket:id="label"></wicket:container>
                </label>
            </div>
        </div>

        <div wicket:id="actief">
        </div>

        <div wicket:id="actiefVanaf"></div>
        <div wicket:id="actiefTotEnMet"></div>

        <div>
            <button wicket:id="opslaan" type="submit"></button>
        </div>

    </form>
</wicket:extend>
</body>
</html>
