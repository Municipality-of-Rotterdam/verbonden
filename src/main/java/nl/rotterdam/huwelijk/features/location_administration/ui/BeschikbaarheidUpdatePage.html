<!DOCTYPE html>
<html xmlns:wicket="http://wicket.apache.org">
<head>
    <meta charset="UTF-8"/>
    <title>Beschikbaarheid wijzigen</title>
</head>
<body>
<wicket:extend>
    <h1>Beschikbaarheid wijzigen</h1>

    <p><a wicket:id="terugLink" class="utrecht-button utrecht-button--secondary-action">Terug naar trouwlocatie</a></p>

    <div wicket:id="feedback"></div>

    <form wicket:id="beschikbaarheidForm" class="d-flex flex-column gap-3">
        <div wicket:id="huwelijkstype">
            <select wicket:id="input"></select>
        </div>
        <div wicket:id="dagVanDeWeek">
            <select wicket:id="input"></select>
        </div>
        <div wicket:id="startTijd"></div>
        <div wicket:id="eindTijd"></div>
        <div wicket:id="duurInMinuten"></div>
        <div wicket:id="prijs"></div>
        <div wicket:id="ingangsdatum"></div>
        <div wicket:id="einddatum"></div>
        <div>
            <button wicket:id="opslaan" type="submit"></button>
        </div>
    </form>
</wicket:extend>
</body>
</html>
