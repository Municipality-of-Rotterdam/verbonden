<!DOCTYPE html>
<html xmlns:wicket="http://wicket.apache.org">
<head>
    <meta charset="UTF-8"/>
    <title>Trouwlocatie wijzigen</title>
</head>
<body>
<wicket:extend>
    <h1>Trouwlocatie wijzigen</h1>

    <p><a wicket:id="terugLink" class="utrecht-button utrecht-button--secondary-action">Terug naar overzicht</a></p>

    <div wicket:id="feedback"></div>

    <form wicket:id="locatieForm" class="d-flex flex-column gap-3">
        <div wicket:id="naam"></div>
        <div wicket:id="fotoUrl"></div>
        <div wicket:id="omschrijving"></div>
        <div wicket:id="detailUrl"></div>
        <div>
            <button wicket:id="opslaan" type="submit"></button>
        </div>
    </form>

    <h2>Beschikbaarheden</h2>

    <p>
        <a wicket:id="nieuwBeschikbaarheidLink" class="utrecht-button utrecht-button--secondary-action">Beschikbaarheid toevoegen</a>
    </p>

    <table wicket:id="beschikbaarheidTable"></table>

    <wicket:fragment wicket:id="beschikbaarheidActiesFragment">
        <a wicket:id="bewerkBeschikbaarheidLink" class="utrecht-button utrecht-button--secondary-action">Bewerken</a>
        <a wicket:id="verwijderBeschikbaarheidLink" class="utrecht-button utrecht-button--secondary-action">Verwijderen</a>
    </wicket:fragment>

    <h2>Niet beschikbare dagen</h2>

    <div class="d-flex gap-2 mb-3">
        <a wicket:id="nieuwNietBeschikbareDagLink" class="utrecht-button utrecht-button--secondary-action">Niet beschikbare dag toevoegen</a>
        <a wicket:id="importNietBeschikbareDagenLink" class="utrecht-button utrecht-button--secondary-action">Importeren vanuit xlsx</a>
    </div>

    <table wicket:id="nietBeschikbareDagenTable"></table>

    <wicket:fragment wicket:id="nietBeschikbareDagActiesFragment">
        <a wicket:id="bewerkNietBeschikbareDagLink" class="utrecht-button utrecht-button--secondary-action">Bewerken</a>
        <a wicket:id="verwijderNietBeschikbareDagLink" class="utrecht-button utrecht-button--secondary-action">Verwijderen</a>
    </wicket:fragment>
</wicket:extend>
</body>
</html>
