<!DOCTYPE html>
<html xmlns:wicket="http://wicket.apache.org">
<head>
    <meta charset="UTF-8"/>
    <title>Trouwlocaties Beheer</title>
</head>
<body>
<wicket:extend>
    <h1>Trouwlocaties Beheer</h1>

    <p>
        <a wicket:id="nieuweLocatieLink" class="utrecht-button utrecht-button--primary-action">Nieuwe trouwlocatie toevoegen</a>
    </p>

    <table wicket:id="locatieTable"></table>

    <wicket:fragment wicket:id="actiesFragment">
        <a wicket:id="bewerkLink" class="utrecht-button utrecht-button--secondary-action">Bewerken</a>
        <a wicket:id="verwijderLink" class="utrecht-button utrecht-button--secondary-action">Verwijderen</a>
    </wicket:fragment>
</wicket:extend>
</body>
</html>
