<!DOCTYPE html>
<html xmlns:wicket="http://wicket.apache.org">
<head>
    <meta charset="UTF-8"/>
    <title>Trouwlocaties Beheer</title>
</head>
<body>
<wicket:extend>
    <h1>Trouwlocaties Beheer</h1>

    <p>
        <a wicket:id="nieuweLocatieLink" class="utrecht-button utrecht-button--primary-action">Nieuwe trouwlocatie toevoegen</a>
    </p>

    <form wicket:id="actionsForm">
        <table wicket:id="locatieTable"></table>
    </form>

    <wicket:fragment wicket:id="actiesFragment">
        <button wicket:id="bewerkLink"><span wicket:id="icon"></span></button>
        <button wicket:id="verwijderLink"><span wicket:id="icon"></span></button>
    </wicket:fragment>
</wicket:extend>
</body>
</html>
