<!DOCTYPE html>
<html xmlns:wicket="http://wicket.apache.org">
<head>
    <meta charset="UTF-8"/>
    <title>Niet beschikbare dag wijzigen</title>
</head>
<body>
<wicket:extend>
    <h1>Niet beschikbare dag wijzigen</h1>

    <p><a wicket:id="terugLink" class="utrecht-button utrecht-button--secondary-action">Terug naar trouwlocatie</a></p>

    <div wicket:id="feedback"></div>

    <form wicket:id="nietBeschikbareDagForm" class="d-flex flex-column gap-3">
        <div wicket:id="datum"></div>
        <div wicket:id="reden"></div>
        <div>
            <button wicket:id="opslaan" type="submit"></button>
        </div>
    </form>
</wicket:extend>
</body>
</html>
