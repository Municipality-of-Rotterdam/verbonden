spring.application.name=huwelijk-poc-copilot

# Database
spring.datasource.url=jdbc:postgresql://localhost:5432/huwelijk
spring.datasource.username=huwelijk
spring.datasource.password=huwelijk
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

# Flyway – manages the database schema
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Beheer-sectie gebruikers (gebruikersnaam:wachtwoord, komma-gescheiden)
# Overschrijf deze waarde in productie met sterke wachtwoorden.
# Voorbeeld: beheer.gebruikers=alice:geheim1,bob:geheim2
beheer.gebruikers=beheerder:rotterdam
