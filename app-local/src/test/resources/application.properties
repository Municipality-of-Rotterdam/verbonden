spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true
beheer.gebruikers=test:test
# Native (non-Docker) provider: runs a real postgres binary as a plain subprocess, no Docker
# Desktop required. The actual postgres version used is pinned at compile time via the
# embedded-postgres-binaries-bom import in app-local/pom.xml.
zonky.test.database.provider=zonky
huwelijk.planning.vanaf-dagen=1
huwelijk.planning.tot-dagen=730
