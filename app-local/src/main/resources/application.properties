spring.application.name=verbonden

# Logging: alles op WARN, alleen onze eigen code (nl.rotterdam) op INFO
logging.level.root=WARN
logging.level.nl.rotterdam=INFO

# Database – application user (DML only)
spring.datasource.url=jdbc:postgresql://localhost:5433/verbonden
spring.datasource.username=verbonden_app
spring.datasource.password=verbonden_app
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

# Flyway – manages the database schema (DDL user)
spring.flyway.enabled=true
# db/sampledata bevat lokale voorbeelddata (o.a. trouwboekjes) bovenop het schema uit core
spring.flyway.locations=classpath:db/migration,classpath:db/sampledata
spring.flyway.user=verbonden_owner
spring.flyway.password=verbonden_owner

# Beheer-sectie gebruikers (gebruikersnaam:wachtwoord, komma-gescheiden)
# Overschrijf deze waarde in productie met sterke wachtwoorden.
# Voorbeeld: beheer.gebruikers=alice:geheim1,bob:geheim2
beheer.gebruikers=beheerder:rotterdam

# Uitloggen-links. In deze lokale opzet handelt Spring Security het uitloggen af
# (zie SecurityConfig). In productie kan dit een URL zijn die de infra afvangt.
verbonden.logout.beheer-url=/logout
verbonden.logout.burger-url=/uitloggen

# Link naar Mijn Loket (eerste item van de breadcrumb op burgerpagina's). Standaard /mijnloket;
# mag ook een andere host zijn, bijvoorbeeld https://loket.amsterdam.nl/jouwloket
verbonden.mijn-loket-url=/mijnloket

# Uploads: Tomcat parseert multipart-requests. Ruimer dan de 20 MB die Wicket per bestand toestaat (zie
# DossierBestandType.MAX_GROOTTE), zodat een te groot bestand een nette melding geeft in plaats van een foutpagina.
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Planningsperiode: minimaal en maximaal aantal dagen vooruit dat een huwelijk gepland kan worden
verbonden.planning.vanaf-dagen=28
verbonden.planning.tot-dagen=365

# Actuator – publiek toegankelijk (zie SecurityConfig), infra (bijv. liveness/readiness
# probes) hangt hiervan af. Alleen health/info worden geexposeerd; overige endpoints
# (env, beans, etc.) blijven uitgeschakeld om geen gevoelige informatie te lekken.
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never

# E-mail – lokaal naar Mailpit (zie compose.yml). Bekijk de verzonden e-mails op http://localhost:8025.
# De mailserver stelt u in met de standaard Spring-instellingen (spring.mail.*); overschrijf deze in productie.
spring.mail.host=localhost
spring.mail.port=1025
# Timeouts staan standaard op 10 seconden (zie SmtpTimeoutConfig); overschrijf ze met spring.mail.properties.mail.smtp.*

# Afzender van e-mails
verbonden.mail.afzender-adres=noreply@rotterdam.nl
verbonden.mail.afzender-naam=Gemeente Rotterdam

# Opnieuw proberen als verzenden mislukt: maximaal aantal pogingen (de eerste meegeteld), de wachttijd na de eerste
# mislukte poging, de factor waarmee die wachttijd na elke poging groeit, en de langste wachttijd.
verbonden.mail.max-pogingen=5
verbonden.mail.wachttijd=1m
verbonden.mail.back-off-factor=2
verbonden.mail.max-wachttijd=1h
# Hoe vaak wordt gezocht naar e-mails die verstuurd moeten worden
verbonden.mail.verwerk-interval=15s
