<!DOCTYPE html>
<html xmlns:wicket="http://wicket.apache.org">
<head>
    <meta charset="UTF-8"/>
    <title>Extra's wijzigen</title>
</head>
<body>
<wicket:extend>
    <h1 wicket:id="titel">Extra's wijzigen</h1>

    <p><a wicket:id="terugLink" class="utrecht-button utrecht-button--secondary-action">Terug naar dossier</a></p>

    <div wicket:id="feedback"></div>

    <form wicket:id="extrasForm" class="d-flex flex-column gap-3">
        <div wicket:id="ringenUitwisselen"></div>
        <div wicket:id="muziek"></div>
        <div wicket:id="trouwboekje">
            <select wicket:id="input"></select>
        </div>
        <div wicket:id="internationaleAkte"></div>
        <div>
            <button wicket:id="opslaan" type="submit"></button>
        </div>
    </form>
</wicket:extend>
</body>
</html>
