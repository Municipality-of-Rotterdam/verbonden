<!DOCTYPE html>
<html xmlns:wicket="http://wicket.apache.org">
<head>
    <meta charset="UTF-8"/>
    <title>Trouwboekjes beheer</title>
</head>
<body>
<wicket:extend>
    <h1>Trouwboekjes beheer</h1>

    <div wicket:id="feedback"></div>

    <div class="mb-3">
        <a wicket:id="nieuwExtraLink" class="utrecht-button utrecht-button--primary-action">Nieuw trouwboekje toevoegen</a>
    </div>

    <form wicket:id="actionsForm">
        <table wicket:id="extrasTable"></table>
    </form>

    <wicket:fragment wicket:id="afbeeldingFragment">
        <img wicket:id="afbeelding" class="rd-trouwboekje-beheer__afbeelding" src="" alt=""/>
    </wicket:fragment>

    <wicket:fragment wicket:id="actiesFragment">
        <button wicket:id="bewerkLink"><span wicket:id="icon"></span></button>
        <button wicket:id="verwijderLink"><span wicket:id="icon"></span></button>
    </wicket:fragment>
</wicket:extend>
</body>
</html>
