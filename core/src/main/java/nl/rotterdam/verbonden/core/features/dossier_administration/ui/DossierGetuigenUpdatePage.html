<!DOCTYPE html>
<html xmlns:wicket="http://wicket.apache.org">
<head>
    <meta charset="UTF-8"/>
    <title>Getuigen wijzigen</title>
</head>
<body>
<wicket:extend>
    <h1 wicket:id="titel">Getuigen wijzigen</h1>

    <p><a wicket:id="terugLink" class="utrecht-button utrecht-button--secondary-action">Terug naar dossier</a></p>

    <p wicket:id="aantal"></p>

    <div wicket:id="feedback"></div>

    <form wicket:id="getuigenForm" class="d-flex flex-column gap-3">
        <section wicket:id="getuigen" class="d-flex flex-column gap-3">
            <h2 wicket:id="kop">Getuige</h2>
            <div wicket:id="naam"></div>
            <div class="d-flex flex-wrap gap-3">
                <div wicket:id="voornamen"></div>
                <div wicket:id="achternaam"></div>
            </div>
            <div wicket:id="geboortedatum"></div>
            <div class="d-flex flex-wrap gap-3">
                <div wicket:id="postcode"></div>
                <div wicket:id="woonplaats"></div>
            </div>
            <div wicket:id="land"></div>
        </section>
        <div>
            <button wicket:id="opslaan" type="submit"></button>
        </div>
    </form>
</wicket:extend>
</body>
</html>
