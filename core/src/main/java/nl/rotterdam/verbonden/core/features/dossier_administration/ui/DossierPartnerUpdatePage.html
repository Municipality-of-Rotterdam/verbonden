<!DOCTYPE html>
<html xmlns:wicket="http://wicket.apache.org">
<head>
    <meta charset="UTF-8"/>
    <title>Partner wijzigen</title>
</head>
<body>
<wicket:extend>
    <h1 wicket:id="titel">Partner wijzigen</h1>

    <p><a wicket:id="terugLink" class="utrecht-button utrecht-button--secondary-action">Terug naar dossier</a></p>

    <p><strong wicket:id="naam">Naam</strong><br/><span wicket:id="bron">Bron</span></p>

    <div wicket:id="feedback"></div>

    <form wicket:id="partnerForm" class="d-flex flex-column gap-3">
        <div wicket:id="persoonsgegevens"></div>
        <div wicket:id="gekozenAchternaam">
            <select wicket:id="input"></select>
        </div>
        <div class="d-flex flex-wrap gap-3">
            <div wicket:id="telefoonnummer"></div>
            <div wicket:id="emailadres"></div>
        </div>
        <div>
            <button wicket:id="opslaan" type="submit"></button>
        </div>
    </form>
</wicket:extend>
</body>
</html>
