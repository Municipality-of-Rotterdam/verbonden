<wicket:extend>
    <p><a wicket:id="terugLink" class="utrecht-button utrecht-button--secondary-action">Terug naar De Dag</a></p>

    <section class="rd-vrije-locatie">
        <h3>Kies uw eigen locatie</h3>
        <p>U kunt buiten een trouwzaal trouwen. De gemeente beoordeelt of uw locatie geschikt is.</p>
        <p>Voor een vrije locatie gelden extra kosten. U heeft hiervoor een locatieverklaring nodig.</p>
        <form wicket:id="vrijeTrouwlocatieForm" class="d-flex flex-column gap-3">
            <div wicket:id="naam"></div>
            <div wicket:id="adres"></div>
            <div wicket:id="telefoonnummer"></div>
            <div wicket:id="contactpersoon"></div>
            <button wicket:id="opslaan" type="submit"></button>
        </form>
    </section>

    <section wicket:id="locaties" class="rd-trouwlocatie">
        <img wicket:id="foto" class="rd-trouwlocatie__foto" alt=""/>
        <h3 wicket:id="naam">Locatie</h3>
        <p wicket:id="omschrijving">Beschrijving</p>
        <p><a wicket:id="meerInfo">Meer informatie over deze locatie</a></p>
        <a wicket:id="kies" class="utrecht-button utrecht-button--primary-action">
            <span wicket:id="kiesLabel">Kies locatie</span>
        </a>
    </section>
</wicket:extend>
