<!DOCTYPE html>
<html xmlns:wicket="http://wicket.apache.org" wicket:id="root" lang="nl" dir="ltr" class="rotterdam-theme">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Beheer</title>
</head>
<body wicket:id="body">

<div class="administration-shell">
    <aside class="administration-sidebar">
        <input wicket:id="sidebarToggle" class="administration-sidebar__toggle" type="checkbox"
               aria-label="Navigatiemenu in- of uitklappen"/>
        <label class="administration-sidebar__toggle-button" for="administration-sidebar-toggle"
               title="Navigatiemenu in- of uitklappen">
            <span aria-hidden="true"></span>
        </label>

        <div class="administration-sidebar__brand">
            <div wicket:id="rotterdamLogoImage"></div>
        </div>

        <nav aria-label="Beheernavigatie">
            <ul class="administration-sidebar__navigation">
                <li wicket:id="navigationItems">
                    <a wicket:id="pageLink">
                        <span wicket:id="navIcon"></span>
                        <span class="administration-sidebar__label" wicket:id="navLabel"></span>
                    </a>
                </li>
            </ul>
        </nav>

        <div class="administration-sidebar__footer">
            <a class="administration-sidebar__logout" wicket:id="logOutLink" title="Uitloggen">
                <span wicket:id="logOutIcon"></span>
                <span class="administration-sidebar__label">Uitloggen</span>
            </a>
            <div class="administration-sidebar__user">
                <span wicket:id="userIcon"></span>
                <span class="administration-sidebar__label">Beheerder</span>
            </div>
        </div>
    </aside>

    <main class="administration-content">
        <div class="administration-content__body" wicket:id="pageBody">
            <wicket:child/>
        </div>
    </main>
</div>

</body>
</html>
