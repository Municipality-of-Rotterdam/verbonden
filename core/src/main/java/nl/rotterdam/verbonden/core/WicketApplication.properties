# ----- Marriage intake: intro paragraphs -----
intake.intro.marriageintake=U en uw partner willen trouwen of een geregistreerd partnerschap aangaan in Rotterdam. Gefeliciteerd!<br/>Hier doet u de melding bij de gemeente en plant u de ceremonie.<br/>Dat doet u natuurlijk samen met uw partner. Daarom vraagt de gemeente uw partner straks om zelf in te loggen met DigiD en te bevestigen dat alles klopt.
intake.intro.dedag=Kies eerst wat voor soort dag u wilt en ga daarna uw dag plannen. Begin bij het onderdeel dat u het belangrijkst vindt. Bijvoorbeeld: Vindt u een datum het belangrijkst? Begin dan bij de datum. En kies daarna de rest. De datum bepaalt welke trouwambtenaren beschikbaar zijn.
intake.intro.dedag.klein=U hebt gekozen voor een gratis ceremonie. Die is altijd op maandagochtend in de Felicitatiezaal van het stadhuis. De gemeente kiest de trouwambtenaar.\n\nKies hieronder een datum en tijd voor de ceremonie. Vul daarna de gegevens in van u en uw partner.

