# ----- Marriage intake: intro paragraphs -----
intake.intro.marriageintake=U gaat een huwelijk of partnerschap aanvragen en registreren. Later in dit proces wordt uw partner gevraagd om in te loggen via DigiD om te bevestigen dat deze registratie klopt. Kies eerst wat voor soort dag u wilt en ga daarna uw dag plannen.
intake.intro.dedag=Kies eerst wat voor soort dag u wilt en ga daarna uw dag plannen. Begin bij het onderdeel dat u het belangrijkst vindt. Bijvoorbeeld: Vindt u een datum het belangrijkst? Begin dan bij de datum. En kies daarna de rest. Een datum heeft invloed op de agenda van een trouwambtenaar.
intake.intro.dedag.klein=U heeft gekozen voor een kleine ceremonie. Daarbij kiest u alleen de datum. De trouwlocatie en de trouwambtenaar kunt u niet zelf kiezen. Kies hieronder uw gewenste datum en vul daarna uw gegevens in.

