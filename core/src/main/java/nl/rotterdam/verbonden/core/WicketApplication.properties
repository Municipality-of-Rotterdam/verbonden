# ----- Marriage intake: intro paragraphs -----
intake.intro.marriageintake=U gaat een huwelijk of partnerschap aanvragen en registreren. Daarna vragen we uw partner om in te loggen met DigiD. Zo bevestigt uw partner dat de gegevens kloppen. Kies eerst wat voor soort dag u wilt en ga daarna uw dag plannen.
intake.intro.dedag=Kies eerst wat voor soort dag u wilt en ga daarna uw dag plannen. Begin bij het onderdeel dat u het belangrijkst vindt. Bijvoorbeeld: Vindt u een datum het belangrijkst? Begin dan bij de datum. En kies daarna de rest. De datum bepaalt welke trouwambtenaren er kunnen.
intake.intro.dedag.klein=U heeft gekozen voor een kleine ceremonie. Daarbij kiest u alleen de datum. De trouwlocatie en de trouwambtenaar kunt u niet zelf kiezen. Kies hieronder uw gewenste datum en vul daarna uw gegevens in.

