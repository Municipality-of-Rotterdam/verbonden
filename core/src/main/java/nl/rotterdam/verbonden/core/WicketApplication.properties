# ----- Marriage intake: intro paragraphs -----
intake.intro.marriageintake=U gaat een huwelijk of partnerschap aanvragen en registreren. Later in dit proces wordt uw partner gevraagd om in te loggen via DigiD om te bevestigen dat deze registratie klopt. Kies eerst wat voor soort dag jullie willen en ga daarna jullie dag plannen.
intake.intro.dedag=Kies eerst wat voor soort dag jullie willen en ga daarna jullie dag plannen. Begin bij het onderdeel wat jullie het belangrijkst vinden. Bijvoorbeeld: Vinden jullie een datum het belangrijkst? Begin dan bij de datum. En kies daarna de rest. Een datum heeft invloed op de agenda van een trouwambtenaar.
intake.intro.dedag.klein=Jullie hebben gekozen voor een kleine ceremonie. Daarbij kiezen jullie alleen de datum. De trouwlocatie en de trouwambtenaar kunnen jullie niet zelf kiezen. Kies hieronder jullie gewenste datum en vul daarna jullie gegevens in.

