<wicket:extend>
    <h1 wicket:id="titel">Betaalmutatie toevoegen</h1>

    <p><a wicket:id="terugLink" class="utrecht-button utrecht-button--secondary-action">Terug naar dossier</a></p>

    <p>Het paar ziet dit bedrag als "Te betalen" als het inlogt, en kan het dan online betalen. Crediteren kan niet
        in Verbonden.</p>

    <div wicket:id="feedback"></div>

    <form wicket:id="betaalmutatieForm" class="d-flex flex-column gap-3">
        <div wicket:id="omschrijving"></div>
        <div wicket:id="bedrag"></div>
        <div>
            <button wicket:id="toevoegen" type="submit"></button>
        </div>
    </form>
</wicket:extend>
