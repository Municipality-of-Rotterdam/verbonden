<!DOCTYPE html>
<html xmlns:wicket="http://wicket.apache.org">
<head>
    <meta charset="UTF-8"/>
    <title>Dossiers Beheer</title>
</head>
<body>
<wicket:extend>
    <h1>Dossiers</h1>

    <form wicket:id="zoekForm" class="d-flex gap-2 mb-3">
        <input wicket:id="zoektermVeld" type="text" class="utrecht-textbox" placeholder="Zoek op dossier-ID of BSN"/>
        <button wicket:id="zoekButton" type="submit" class="utrecht-button utrecht-button--primary-action">Zoeken</button>
    </form>

    <form wicket:id="actiesForm">
        <table wicket:id="dossierTable"></table>
    </form>

    <wicket:fragment wicket:id="actiesFragment">
        <span class="d-flex gap-2">
            <button wicket:id="accepteerButton" type="submit" class="text-nowrap"></button>
            <button wicket:id="wijsAfButton" type="submit" class="text-nowrap"></button>
        </span>
    </wicket:fragment>
</wicket:extend>
</body>
</html>
