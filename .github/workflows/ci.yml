name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK from .java-version
        uses: actions/setup-java@v4
        with:
          java-version-file: .java-version
          distribution: temurin

      - name: Get current date
        id: date
        run: echo "date=$(date +'%Y-%m-%d')" >> $GITHUB_OUTPUT

      - name: Cache Maven wrapper
        uses: actions/cache@v4
        with:
          path: ~/.m2/wrapper
          key: maven-wrapper-${{ runner.os }}-${{ hashFiles('.mvn/wrapper/maven-wrapper.properties') }}-${{ steps.date.outputs.date }}
          restore-keys: |
            maven-wrapper-${{ runner.os }}-${{ hashFiles('.mvn/wrapper/maven-wrapper.properties') }}-
            maven-wrapper-${{ runner.os }}-

      - name: Cache Maven dependencies
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: maven-deps-${{ runner.os }}-${{ hashFiles('**/pom.xml') }}-${{ steps.date.outputs.date }}
          restore-keys: |
            maven-deps-${{ runner.os }}-${{ hashFiles('**/pom.xml') }}-
            maven-deps-${{ runner.os }}-

      - name: Build with Maven
        run: ./mvnw --no-transfer-progress -B verify
