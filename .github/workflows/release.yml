name: Release to Maven Central

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (e.g. 0.1.0)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    environment: release

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: main

      - name: Set up JDK from .java-version
        uses: actions/setup-java@v5
        with:
          java-version-file: .java-version
          distribution: temurin
          cache: maven
          server-id: central
          server-username: MAVEN_CENTRAL_USERNAME
          server-password: MAVEN_CENTRAL_PASSWORD
          gpg-private-key: ${{ secrets.GPG_PRIVATE_KEY }}
          gpg-passphrase: MAVEN_GPG_PASSPHRASE

      - name: Set release version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          ./mvnw --no-transfer-progress -B \
            org.codehaus.mojo:versions-maven-plugin:2.21.0:set \
            -DnewVersion="${VERSION}" \
            -DprocessAllModules \
            -DgenerateBackupPoms=false

      - name: Build and verify
        run: ./mvnw --no-transfer-progress -B verify

      - name: Deploy to Maven Central
        env:
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: ./mvnw --no-transfer-progress -B -Prelease -DskipTests deploy

      - name: Commit and tag release
        env:
          VERSION: ${{ inputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add pom.xml core/pom.xml remote-local/pom.xml app-local/pom.xml
          git commit -m "Release verbonden ${VERSION}"

          # The Maven Central publish above is irreversible, so don't give up on a
          # non-fast-forward push if main moved during the build/deploy: retry with
          # a rebase instead of failing outright and leaving main/tag out of sync
          # with the already-published artifact.
          for attempt in 1 2 3; do
            git tag -f "v${VERSION}"
            if git push origin main && git push origin "v${VERSION}"; then
              exit 0
            fi
            echo "Push failed (attempt ${attempt}/3); fetching and rebasing onto origin/main..."
            git tag -d "v${VERSION}"
            git fetch origin main
            git rebase origin/main
          done

          echo "::error::Failed to push the release commit/tag for v${VERSION} after 3 attempts. The Maven Central artifact is already published — see RELEASING.md Troubleshooting to push the commit and tag 'v${VERSION}' to main manually."
          exit 1
