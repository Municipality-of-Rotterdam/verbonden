name: verbonden
services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: verbonden
      POSTGRES_USER: verbonden_owner
      POSTGRES_PASSWORD: verbonden_owner
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./docker/postgres:/docker-entrypoint-initdb.d

  # Lokale mailserver: vangt alle e-mail op. SMTP op poort 1025, inbox op http://localhost:8025.
  mailpit:
    image: axllent/mailpit
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  postgres_data:
